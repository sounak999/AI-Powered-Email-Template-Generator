server:
  port: ${SERVER_PORT:8080}

spring:
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
          temperature: 0.3
          max-output-tokens: 300

logging:
  level:
    com.indusnet.emailtemplate: INFO
